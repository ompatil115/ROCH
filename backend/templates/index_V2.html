<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROCH</title>
</head>
<body style="font-family: sans-serif; color: #333; margin: 0; padding: 24px;">

  <div style="display: flex; flex-wrap: wrap; gap: 8px 32px; justify-content: center; font-family: monospace; font-size: 13px; margin-bottom: 24px;">
    <div><span id="carDot" style="color: #999;">●</span> CAR: <span id="carText">--</span></div>
    <div><span id="gloveDot" style="color: #999;">●</span> GLOVE: <span id="gloveText">--</span></div>
    <div id="statusWarning" style="display: none; color: #c00; font-weight: bold;">STATUS UNAVAILABLE</div>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 48px; justify-content: center; align-items: flex-start;">

    <div style="display: flex; gap: 28px; align-items: flex-start;">

      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="position: relative; width: 44px; height: 220px; background: #eee; border: 1px solid #ccc; border-radius: 4px; overflow: hidden;">
          <div id="distFill" style="position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: #888;"></div>
        </div>
        <span style="font-size: 13px;">Distance</span>
        <span style="font-size: 13px;"><span id="distValue">400</span> cm</span>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 70px;">
        <div style="position: relative; width: 44px; height: 220px; background: #eee; border: 1px solid #ccc; border-radius: 4px; overflow: hidden;">
          <div id="proximityFill" style="position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: rgb(0, 200, 0);"></div>
        </div>
        <span style="font-size: 13px;">Proximity</span>
        <span id="blockLabel" style="font-size: 13px; font-weight: bold; color: #c00; min-height: 18px;"></span>
      </div>

    </div>

    <div style="display: flex; gap: 20px; align-items: flex-start;">

      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
        <div id="padContainer" style="position: relative; width: 220px; height: 220px; background: #eee; border: 1px solid #ccc; border-radius: 8px;">
          <div id="handle" style="position: absolute; width: 20px; height: 20px; border-radius: 50%; left: 100px; top: 100px; background: #333; cursor: pointer; touch-action: none;"></div>
        </div>
        <span style="font-size: 13px;">Drive pad</span>
        <span id="driveMode" style="font-size: 13px;">HUD driving</span>
        <span id="deadStopLabel" style="font-size: 13px; font-weight: bold; color: #c00; min-height: 18px;"></span>
      </div>

      <div style="font-family: monospace; font-size: 14px; line-height: 1.6; min-width: 90px;">
        <div id="wheelReadout" style="color: #333; margin-bottom: 8px;">
          <div>WL: <span id="wl">0</span> (<span id="wlp">0</span>%)</div>
          <div>WR: <span id="wr">0</span> (<span id="wrp">0</span>%)</div>
        </div>
        <div id="angleReadout" style="color: #c00; opacity: 0.35;">
          <div>PI: <span id="pi">0</span> (<span id="pip">0</span>%)</div>
          <div>RO: <span id="ro">0</span> (<span id="rop">0</span>%)</div>
          <div>NP: <span id="np">0</span></div>
          <div>NR: <span id="nr">0</span></div>
        </div>
      </div>

    </div>

  </div>

  <script>
    // HUD V2 Code      //
    // Om Patil         //
    // 2026-11-05       //

    // ---------- Constants ----------
    const PAD_RADIUS = 100;
    const PITCH_LIMIT = 45;
    const ROLL_LIMIT = 70;
    const HANDLE_SIZE = 20;
    const CENTER = PAD_RADIUS + HANDLE_SIZE / 2;
    const POLL_MS = 100;
    const STATUS_MS = 1000;
    const SEND_MS = 100;
    const REQUEST_TIMEOUT_MS = 500;
    const RELEASE_TIMEOUT_MS = 2000;
    const RELEASE_HOLDOFF_MS = 500;
    const GLIDE = "left 0.15s linear, top 0.15s linear";
    const DIM_OPACITY = 0.35;
    const KEY_TICK_MS = 20;
    const RAMP_SECONDS = 1;
    const RAMP_RATE = 100 / RAMP_SECONDS;
    const BRAKE_MULTIPLIER = 2;
    const DRIVE_KEYS = ["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright"];
    const COLOR_STOPS = [
      {pos: 0,   r: 0,   g: 200, b: 0},
      {pos: 40,  r: 255, g: 220, b: 0},
      {pos: 70,  r: 255, g: 140, b: 0},
      {pos: 100, r: 230, g: 0,   b: 0}
    ];
    const CAR_STALE_S = 1;
    const COLOR_OK = "#0a0";
    const COLOR_ALERT = "#c00";
    const COLOR_OFF = "#999";

    // ---------- Elements ----------
    const padContainer = document.getElementById("padContainer");
    const handle = document.getElementById("handle");
    const distFill = document.getElementById("distFill");
    const distValue = document.getElementById("distValue");
    const proximityFill = document.getElementById("proximityFill");
    const blockLabel = document.getElementById("blockLabel");
    const driveMode = document.getElementById("driveMode");
    const deadStopLabel = document.getElementById("deadStopLabel");
    const wheelReadout = document.getElementById("wheelReadout");
    const angleReadout = document.getElementById("angleReadout");
    const wlValue = document.getElementById("wl");
    const wlPercent = document.getElementById("wlp");
    const wrValue = document.getElementById("wr");
    const wrPercent = document.getElementById("wrp");
    const piValue = document.getElementById("pi");
    const piPercent = document.getElementById("pip");
    const roValue = document.getElementById("ro");
    const roPercent = document.getElementById("rop");
    const npValue = document.getElementById("np");
    const nrValue = document.getElementById("nr");
    const carDot = document.getElementById("carDot");
    const carText = document.getElementById("carText");
    const gloveDot = document.getElementById("gloveDot");
    const gloveText = document.getElementById("gloveText");
    const statusWarning = document.getElementById("statusWarning");

    // ---------- State ----------
    let dragging = false;
    let sending = false;
    let polling = false;
    let statusPolling = false;
    let sendTimer = null;
    let padLeft = 0;
    let padRight = 0;
    let releasedAt = 0;
    let gloveDriving = false;
    let deadStop = false;
    let keysHeld = new Set();
    let keySpeed = 0;
    let keyTurn = 0;
    let keyMoving = false;
    let lastTick = Date.now();
    let lastKeySend = 0;
    let blocked = false;
    let dragDx = 0;
    let dragDy = 0;

    // ---------- Poll ----------
    async function pollState() {
      if (polling) return;
      polling = true;
      const startedAt = Date.now();
      try {
        const response = await fetch("/state", {signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS)});
        const data = await response.json();
        updateProx(data.prox);
        if (dragging) applyDrag();
        updateReadout(data.wheels);
        if (startedAt > releasedAt) updateWheels(data.wheels);
        hudControl(data.wheels);
      } catch (error) {
        console.log(error);
      } finally {
        polling = false;
      }
    }

    // ---------- Status ----------
    async function pollStatus() {
      if (statusPolling) return;
      statusPolling = true;
      try {
        const response = await fetch("/status", {signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS)});
        if (!response.ok) throw new Error(`status ${response.status}`);
        const data = await response.json();
        statusWarning.style.display = "none";
        updateCarStatus(data.car);
        updateGloveStatus(data.glove);
      } catch (error) {
        statusWarning.style.display = "block";
        setStatus(carDot, carText, COLOR_OFF, "--");
        setStatus(gloveDot, gloveText, COLOR_OFF, "--");
        console.log(error);
      } finally {
        statusPolling = false;
      }
    }

    function formatAge(age) {
      if (age === null) return "no data";
      if (age < 60) return `${age.toFixed(1)}s`;
      const total = Math.round(age);
      return `${Math.floor(total / 60)}m ${total % 60}s`;
    }

    function statusDetail(link) {
      const port = link.port ? link.port.replace("/dev/tty", "") : "";
      return [port, link.type, link.baud, formatAge(link.age)].filter(Boolean).join(" ");
    }

    function setStatus(dot, text, color, message) {
      dot.style.color = color;
      text.textContent = message;
    }

    function updateCarStatus(car) {
      if (!car.connected) {
        setStatus(carDot, carText, COLOR_ALERT, "not connected");
        return;
      }
      const stale = car.age === null || car.age > CAR_STALE_S;
      setStatus(carDot, carText, stale ? COLOR_ALERT : COLOR_OK, (stale ? "STALE " : "connected ") + statusDetail(car));
    }

    function gloveLinks(glove) {
      const links = [];
      if (glove.http.connected) links.push(["http", glove.http.ip, formatAge(glove.http.age)].filter(Boolean).join(" "));
      if (glove.serial.connected) links.push(statusDetail({port: glove.serial.port, type: "serial", baud: glove.serial.baud, age: null}).replace(" no data", ""));
      return links;
    }

    function updateGloveStatus(glove) {
      const links = gloveLinks(glove);
      if (links.length === 0) {
        setStatus(gloveDot, gloveText, COLOR_OFF, "not connected");
        return;
      }
      setStatus(gloveDot, gloveText, glove.inUse ? COLOR_ALERT : COLOR_OK, (glove.inUse ? "in use " : "connected ") + links.join(" | "));
    }

    // ---------- Display ----------
    function updateProx(prox) {
      const dist = prox.dist;
      const distPercent = Math.min(100, Math.max(0, dist / 400 * 100));
      const proximity = Math.min(80, Math.max(25, dist));
      const proximityPercent = (80 - proximity) / 55 * 100;
      blocked = prox.blocked === 1;

      distValue.textContent = dist > 400 ? "400+" : dist;
      distFill.style.height = `${distPercent}%`;
      proximityFill.style.height = `${proximityPercent}%`;
      proximityFill.style.background = proximityColor(proximityPercent);
      blockLabel.textContent = blocked ? "BLOCKED" : "";
    }

    function proximityColor(percent) {
      let lower = COLOR_STOPS[0];
      let upper = COLOR_STOPS[COLOR_STOPS.length - 1];
      for (let i = 0; i < COLOR_STOPS.length - 1; i++) {
        if (percent >= COLOR_STOPS[i].pos && percent <= COLOR_STOPS[i + 1].pos) {
          lower = COLOR_STOPS[i];
          upper = COLOR_STOPS[i + 1];
          break;
        }
      }
      const frac = (percent - lower.pos) / (upper.pos - lower.pos);
      const r = Math.round(lower.r + (upper.r - lower.r) * frac);
      const g = Math.round(lower.g + (upper.g - lower.g) * frac);
      const b = Math.round(lower.b + (upper.b - lower.b) * frac);
      return `rgb(${r}, ${g}, ${b})`;
    }

    function updateWheels(wheels) {
      const left = wheels.left;
      const right = wheels.right;

      let fast, slow, direction;
      if (Math.abs(left) >= Math.abs(right)) {
        fast = left;
        slow = right;
        direction = 1;
      } else {
        fast = right;
        slow = left;
        direction = -1;
      }
      const speed = fast;
      const reduction = fast === 0 ? 0 : (Math.abs(fast) - Math.abs(slow)) / Math.abs(fast) * 100;
      const turn = direction * reduction;

      if (!dragging && Date.now() - releasedAt > RELEASE_HOLDOFF_MS) {
        handle.style.left = (CENTER + (turn / 100) * PAD_RADIUS - HANDLE_SIZE / 2) + "px";
        handle.style.top = (CENTER - (speed / 100) * PAD_RADIUS - HANDLE_SIZE / 2) + "px";
      }
    }

    function updateReadout(wheels) {
      const fast = Math.max(Math.abs(wheels.left), Math.abs(wheels.right));
      const leftReduction = fast === 0 ? 0 : (fast - Math.abs(wheels.left)) / fast * 100;
      const rightReduction = fast === 0 ? 0 : (fast - Math.abs(wheels.right)) / fast * 100;

      wlValue.textContent = wheels.left;
      wlPercent.textContent = Math.round(leftReduction);
      wrValue.textContent = wheels.right;
      wrPercent.textContent = Math.round(rightReduction);
      piValue.textContent = wheels.pitch;
      piPercent.textContent = Math.round(wheels.pitch / PITCH_LIMIT * 100);
      roValue.textContent = wheels.roll;
      roPercent.textContent = Math.round(wheels.roll / ROLL_LIMIT * 100);
      npValue.textContent = wheels.neutralPitch;
      nrValue.textContent = wheels.neutralRoll;
    }

    // ---------- HUD Control ----------
    function hudControl(wheels) {
      const gesture = wheels.gesture;
      const gloveActive = gesture === 1;
      gloveDriving = gloveActive;
      handle.style.background = gloveActive ? "red" : "#333";
      handle.style.pointerEvents = gloveActive ? "none" : "auto";
      driveMode.textContent = gloveActive ? "Glove driving" : "HUD driving";
      handle.style.transition = gloveActive ? GLIDE : "none";
      wheelReadout.style.color = gloveActive ? "#c00" : "#333";
      angleReadout.style.opacity = gloveActive ? 1 : DIM_OPACITY;
      if (gloveActive && dragging) stopDrag();
    }

    function padToWheels(dx, dy) {
      const turn = dx / PAD_RADIUS * 100;
      const speed = -dy / PAD_RADIUS * 100;
      const reduction = 1 - Math.abs(turn) / 100;
      if (turn >= 0) return {left: speed, right: speed * reduction};
      return {left: speed * reduction, right: speed};
    }

    function moveDrag(e) {
      const rect = padContainer.getBoundingClientRect();
      dragDx = Math.max(-PAD_RADIUS, Math.min(PAD_RADIUS, e.clientX - (rect.left + rect.width / 2)));
      dragDy = Math.max(-PAD_RADIUS, Math.min(PAD_RADIUS, e.clientY - (rect.top + rect.height / 2)));
      applyDrag();
    }

    function applyDrag() {
      const dx = dragDx;
      const dy = blocked ? Math.max(0, dragDy) : dragDy;
      handle.style.left = (CENTER + dx - HANDLE_SIZE / 2) + "px";
      handle.style.top = (CENTER + dy - HANDLE_SIZE / 2) + "px";
      const w = padToWheels(dx, dy);
      padLeft = w.left;
      padRight = w.right;
    }

    function stopDrag() {
      clearInterval(sendTimer);
      dragging = false;
    }

    function releaseDrag() {
      if (!dragging) return;
      stopDrag();
      releasedAt = Date.now();
      handle.style.left = (CENTER - HANDLE_SIZE / 2) + "px";
      handle.style.top = (CENTER - HANDLE_SIZE / 2) + "px";
      sendWheels(0, 0, RELEASE_TIMEOUT_MS);
    }

    function sendWheels(left, right, timeoutMs) {
      return fetch("/wheels", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({left: Math.round(left), right: Math.round(right)}),
        signal: AbortSignal.timeout(timeoutMs)
      }).catch(() => {});
    }

    // ---------- Keyboard ----------
    function approach(value, target, dt, opposing) {
      if (opposing) {
        const brakeStep = RAMP_RATE * BRAKE_MULTIPLIER * dt;
        if (Math.abs(value) > brakeStep) return value - Math.sign(value) * brakeStep;
        dt -= Math.abs(value) / (RAMP_RATE * BRAKE_MULTIPLIER);
        value = 0;
      }
      const step = RAMP_RATE * dt;
      if (Math.abs(target - value) <= step) return target;
      return value + Math.sign(target - value) * step;
    }

    function updateAxis(value, plusKeys, minusKeys, dt) {
      const plus = plusKeys.some((key) => keysHeld.has(key));
      const minus = minusKeys.some((key) => keysHeld.has(key));
      const target = ((plus ? 1 : 0) - (minus ? 1 : 0)) * 100;
      const opposing = (value > 0 && minus) || (value < 0 && plus);
      return approach(value, target, dt, opposing);
    }

    function resetKeyboard() {
      keySpeed = 0;
      keyTurn = 0;
      keyMoving = false;
    }

    function rampTick() {
      const now = Date.now();
      const dt = (now - lastTick) / 1000;
      lastTick = now;

      if (dragging || deadStop || gloveDriving) {
        resetKeyboard();
        return;
      }

      keySpeed = updateAxis(keySpeed, ["w", "arrowup"], ["s", "arrowdown"], dt);
      keyTurn = updateAxis(keyTurn, ["d", "arrowright"], ["a", "arrowleft"], dt);
      if (blocked && keySpeed > 0) keySpeed = 0;

      if (keySpeed === 0 && keyTurn === 0) {
        if (keyMoving) {
          keyMoving = false;
          releasedAt = now;
          sendWheels(0, 0, RELEASE_TIMEOUT_MS);
        }
        return;
      }

      keyMoving = true;
      releasedAt = now;
      const dx = keyTurn / 100 * PAD_RADIUS;
      const dy = -keySpeed / 100 * PAD_RADIUS;
      handle.style.left = (CENTER + dx - HANDLE_SIZE / 2) + "px";
      handle.style.top = (CENTER + dy - HANDLE_SIZE / 2) + "px";
      const w = padToWheels(dx, dy);
      if (!sending && now - lastKeySend >= SEND_MS) {
        sending = true;
        lastKeySend = now;
        sendWheels(w.left, w.right, REQUEST_TIMEOUT_MS).finally(() => { sending = false; });
      }
    }

    function startDeadStop() {
      deadStop = true;
      keysHeld.clear();
      resetKeyboard();
      if (dragging) stopDrag();
      releasedAt = Date.now();
      handle.style.left = (CENTER - HANDLE_SIZE / 2) + "px";
      handle.style.top = (CENTER - HANDLE_SIZE / 2) + "px";
      padContainer.style.opacity = DIM_OPACITY;
      deadStopLabel.textContent = "DEAD STOP INITIATED";
      sendWheels(0, 0, RELEASE_TIMEOUT_MS);
    }

    function endDeadStop() {
      deadStop = false;
      padContainer.style.opacity = 1;
      deadStopLabel.textContent = "";
    }

    // ---------- Listeners ----------
    handle.addEventListener("pointerdown", (e) => {
      if (dragging || deadStop) return;
      handle.setPointerCapture(e.pointerId);
      dragging = true;
      moveDrag(e);
      sendTimer = setInterval(() => {
        if (sending) return;
        sending = true;
        sendWheels(padLeft, padRight, REQUEST_TIMEOUT_MS).finally(() => { sending = false; });
      }, SEND_MS);
    });

    handle.addEventListener("pointermove", (e) => {
      if (dragging) moveDrag(e);
    });

    handle.addEventListener("pointerup", releaseDrag);
    handle.addEventListener("pointercancel", releaseDrag);

    document.addEventListener("keydown", (e) => {
      if (gloveDriving || e.ctrlKey || e.metaKey || e.altKey) return;
      const key = e.key.toLowerCase();
      if (key === "x") {
        if (!deadStop) startDeadStop();
        return;
      }
      if (!DRIVE_KEYS.includes(key)) return;
      e.preventDefault();
      if (!deadStop) keysHeld.add(key);
    });

    document.addEventListener("keyup", (e) => {
      const key = e.key.toLowerCase();
      if (key === "x") endDeadStop();
      keysHeld.delete(key);
    });

    window.addEventListener("blur", () => {
      keysHeld.clear();
      endDeadStop();
    });

    // ---------- Main ----------
    setInterval(pollState, POLL_MS);
    setInterval(pollStatus, STATUS_MS);
    pollStatus();
    setInterval(rampTick, KEY_TICK_MS);
  </script>

</body>
</html>
